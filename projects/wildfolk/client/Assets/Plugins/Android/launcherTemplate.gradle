// Upload credentials are process environment only; never generated into Gradle source.
def uploadStore = System.getenv('LOWFIRE_UPLOAD_KEYSTORE')
def uploadAlias = System.getenv('LOWFIRE_UPLOAD_ALIAS')
def uploadPassword = System.getenv('LOWFIRE_UPLOAD_PASSWORD')
def uploadReady = uploadStore && uploadAlias && uploadPassword
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested && !uploadReady) {
    throw new GradleException('Stable Lowfire upload signing environment required for release tasks')
}

apply plugin: 'com.android.application'
apply from: 'setupSymbols.gradle'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'

dependencies {
    implementation project(':unityLibrary')
}

android {
    namespace "**NAMESPACE**"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        applicationId '**APPLICATIONID**'
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    lint {
        abortOnError false
    }

    signingConfigs {
        upload {
            if (uploadReady) {
                storeFile file(uploadStore)
                storeType 'PKCS12'
                storePassword uploadPassword
                keyAlias uploadAlias
                keyPassword uploadPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled **MINIFY_DEBUG**
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            jniDebuggable true
        }
        release {
            signingConfig signingConfigs.upload
            minifyEnabled **MINIFY_RELEASE**
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }**PACKAGING****PLAY_ASSET_PACKS****SPLITS**
**BUILT_APK_LOCATION**
    bundle {
        language {
            enableSplit false
        }
        density {
            enableSplit false
        }
        abi {
            enableSplit true
        }
        texture {
            enableSplit true
        }
    }

	**GOOGLE_PLAY_DEPENDENCIES**
