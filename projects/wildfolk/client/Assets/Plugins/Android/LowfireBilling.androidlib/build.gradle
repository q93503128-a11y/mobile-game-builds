apply plugin: 'com.android.library'

android {
    namespace 'com.gltam.lowfire.billing'
    compileSdk 36
    defaultConfig { minSdk 25; targetSdk 36; consumerProguardFiles 'consumer-rules.pro' }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.android.billingclient:billing:9.1.0' }
