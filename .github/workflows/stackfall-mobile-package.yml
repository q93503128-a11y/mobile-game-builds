name: Stackfall Mobile Package

on:
  push:
    branches: [main]
    paths:
      - 'projects/stackfall-mobile/**'
      - '.github/workflows/stackfall-mobile-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build chat handoff ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('projects/stackfall-mobile')
          output = Path('STACKFALL_MOBILE.zip')
          excluded = {'Library', 'Temp', 'Logs', 'obj', 'Build', 'Builds', 'UserSettings', 'MemoryCaptures', 'Recordings'}

          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if any(part in excluded for part in relative.parts):
                      continue
                  zf.write(path, Path('stackfall-mobile') / relative)
          PY

      - name: Upload chat handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: STACKFALL_MOBILE
          path: STACKFALL_MOBILE.zip
          if-no-files-found: error
          retention-days: 7
